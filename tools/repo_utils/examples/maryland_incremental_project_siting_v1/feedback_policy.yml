schema_version: 1
artifact_type: HOPE.feedback_policy
max_iterations: 3
routes:
  rps_slack:
    classification: planning_structural
    owner: gtep
    severity: high
    minimum_distinct_realizations: 2
    inference: >-
      A policy shortfall that persists across distinct defensible siting
      realizations is more consistent with an upstream technology-mix,
      renewable-availability, or clean-import assumption than with bus siting.
    revisable: true
    approval_required: true
    approval_class: material_planning_assumption
    proposed_changes:
      - path: gtep.resource_mix.qualifying_clean_energy
        operation: rerun_optimization_with_bounded_search
        before: current_approved_capacity_plan
        after: optimized_child_capacity_plan
        envelope:
          max_additional_nameplate_mw: 2000
          preserve:
            - rps_target
            - planning_reserve_margin
            - demand
            - assessment_thresholds
            - evaluation_horizon
    allowed_actions:
      - add or substitute eligible qualifying renewable candidates
      - review renewable availability and firm clean-import evidence
      - rerun GTEP and publish a new capacity plan with full delta lineage
    forbidden_actions:
      - lower the RPS target or PCM acceptance threshold
      - edit PCM outputs or the accepted parent capacity plan
      - treat an inferred cause as an authoritative planning instruction
  load_shedding:
    classification: planning_structural
    owner: gtep
    severity: critical
    minimum_distinct_realizations: 2
    inference: >-
      Repeated unserved energy may indicate insufficient firm capacity,
      flexibility, storage duration, transmission, or location constraints.
    revisable: true
    approval_required: true
    approval_class: material_planning_assumption
    proposed_changes:
      - path: gtep.adequacy_and_flexibility
        operation: rerun_optimization_with_bounded_search
        before: current_approved_capacity_plan
        after: optimized_child_capacity_plan
    allowed_actions:
      - review firm capacity, flexibility, storage duration, and interface constraints
    forbidden_actions:
      - enable or increase load shedding to make the assessment pass
      - lower the operational acceptance threshold
  pcm_infeasible:
    classification: assessment_model_diagnosis
    owner: pcm
    severity: critical
    inference: >-
      Mathematical infeasibility is not yet a causal diagnosis; obtain conflict
      or minimum-slack evidence before routing any upstream revision.
    revisable: true
    approval_required: false
    approval_class: diagnostic_only
    proposed_changes:
      - path: pcm.diagnostics
        operation: produce_conflict_or_minimum_slack_artifact
        before: no_diagnostic
        after: diagnostic_artifact
    allowed_actions:
      - generate conflict, violated-group, or separately labeled minimum-slack evidence
    forbidden_actions:
      - report a feasibility relaxation as the original model solution
      - mutate GTEP decisions before diagnosis
  execution_failure:
    classification: execution_or_numerical_failure
    owner: pcm_runtime
    severity: critical
    inference: >-
      Model construction or execution failed, so no scientific conclusion is
      justified until reproducible runtime diagnostics are available.
    revisable: true
    approval_required: false
    approval_class: diagnostic_only
    proposed_changes:
      - path: pcm.runtime_diagnostics
        operation: reproduce_and_diagnose
        before: failed_execution
        after: diagnostic_artifact
    allowed_actions:
      - reproduce under the approved numerical policy and publish diagnostics
    forbidden_actions:
      - classify the unsolved case as feasible or infeasible
      - change scientific assumptions to hide a software failure
  generic_failure:
    classification: unrouted_assessment_failure
    owner: verifier
    severity: high
    inference: >-
      A failed assessment outcome was not represented by a recognized metric;
      the verifier must extend or correct the assessment contract before routing.
    revisable: false
    approval_required: false
    approval_class: none
    proposed_changes: []
    allowed_actions:
      - inspect the authoritative assessment and extend the typed routing contract
    forbidden_actions:
      - treat an unknown failure as accepted
  human_review:
    classification: unresolved_approval
    owner: human_approver
    severity: high
    inference: >-
      One or more selected physical projects retain conditional evidence and
      cannot be represented as approved by an automated agent.
    revisable: true
    approval_required: true
    approval_class: project_evidence_approval
    proposed_changes:
      - path: realization.project_evidence
        operation: approve_reject_or_replace_selected_project
        before: conditional_or_under_review
        after: explicit_human_decision
    allowed_actions:
      - approve, reject, or request replacement of the flagged project
    forbidden_actions:
      - infer approval from silence
      - remove the review flag without evidence
