schema_version: 1
artifact_type: HOPE.physical_realization
workflow: GTEP-PCM

topology:
  planning_basis: zone
  planning_node_table: zonedata.csv
  physical_node_table: busdata.csv
  physical_branch_table: branchdata.csv
  expected_counts:
    planning_nodes: 5
    physical_nodes: 656
    physical_branches: 838

resource_siting:
  generation:
    method: computed_allocation
  storage:
    method: computed_allocation

computed_realization:
  candidate_site_catalog: >-
    ../../tools/repo_utils/examples/maryland_computed_realization_v1/candidate_site_catalog.csv
  realization_policy: >-
    ../../tools/repo_utils/examples/maryland_computed_realization_v1/realization_policy.yml
  selected_variant: balanced_baseline
  fast_screen:
    require_pass: true
    # Optional study assumption; omitted by default because this proxy is not a
    # DC, AC, contingency, or interconnection study.
    # max_allocation_to_incident_rating_ratio: 1.0

transmission_realization:
  method_priority:
    - corridor_id
    - explicit_endpoints

identity:
  existing_assets: Asset_ID
  candidates: Candidate_ID
  realized_asset_pattern: "<Candidate_ID>__UNIT_<sequence>"

provenance:
  source_register:
    case: pcm
    path: references/source_data_register.csv
  confidence:
    bus_coordinates: observed_or_derived_from_osm
    topology: derived_from_osm
    voltage: observed_where_tagged_otherwise_inferred
    electrical_parameters: inferred
    candidate_siting: topology_screened_workflow_proxy
  disclaimer: >-
    Public-data transmission reconstruction and topology-screened siting proxy
    for workflow testing. This is not an official PJM network, queue,
    permitting, land-use, or interconnection study.
