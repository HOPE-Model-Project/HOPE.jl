[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hope-mcp-server"
version = "0.1.0"
description = "Proof-of-concept MCP server for the HOPE Julia project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30.0,<3",
  "PyYAML>=6.0",
]

# Keep transitive MCP runtime dependencies above known vulnerable releases.
# These are resolver constraints, not additional direct runtime dependencies.
[tool.uv]
constraint-dependencies = [
  "anyio>=4.14.2",
  "certifi>=2026.10.18",
  "cryptography>=50.0.0",
  "idna>=3.15",
  "PyJWT>=2.15.1",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
  "starlette>=1.3.1",
]

[project.scripts]
hope-mcp-server = "hope_mcp_server.server:main"
hope-mcp-server-chatgpt = "hope_mcp_server.chatgpt:main"
hope-agent-experiment-summary = "hope_mcp_server.experiment_summary:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_mcp_server"]
