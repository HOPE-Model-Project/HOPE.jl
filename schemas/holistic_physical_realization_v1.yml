schema_name: HOPE holistic physical realization
schema_version: 1
artifact_type: HOPE.physical_realization
status: stable
description: >-
  Declares how an aggregate GTEP planning system is realized on the physical
  network used by PCM. The contract records mapping rules and provenance; it
  does not change either model's mathematical formulation.

required_top_level:
  schema_version:
    type: integer
    value: 1
  artifact_type:
    type: string
    value: HOPE.physical_realization
  workflow:
    type: string
    value: GTEP-PCM
  topology:
    type: mapping
  resource_siting:
    type: mapping
  transmission_realization:
    type: mapping
  provenance:
    type: mapping

topology:
  planning_basis:
    type: string
    allowed: [zone, bus]
  planning_node_table:
    type: string
    description: GTEP table containing planning nodes.
  physical_node_table:
    type: string
    description: PCM bus table containing Bus_id and Zone_id.
  physical_branch_table:
    type: string
    description: PCM branch table containing physical endpoints.
  expected_counts:
    type: mapping
    optional: true
    fields:
      planning_nodes: integer
      physical_nodes: integer
      physical_branches: integer

resource_siting:
  generation:
    type: mapping
    fields:
      method:
        allowed: [explicit_bus, legacy_zone, computed_allocation]
      bus_column:
        required_when: method == explicit_bus
        default: Bus_id
      planning_zone_column:
        default: Planning_Zone
  storage:
    type: mapping
    fields:
      method:
        allowed: [explicit_bus, legacy_zone, computed_allocation]
      bus_column:
        required_when: method == explicit_bus
        default: Bus_id
      planning_zone_column:
        default: Planning_Zone
  allocation_semantics:
    explicit_bus: >-
      Each candidate row identifies the exact physical PCM bus. Built capacity
      remains conserved and receives a stable Asset_ID derived from Candidate_ID.
    legacy_zone: >-
      Existing validated row or aggregate mapping remains available for old
      zonal cases. It is not sufficient for a strict nodal realization contract.
    computed_allocation: >-
      A versioned candidate-site catalog and realization policy allocate solved
      zonal builds before the existing explicit-bus PCM construction is called.

computed_realization:
  optional: true
  required_when: >-
    generation.method == computed_allocation or storage.method == computed_allocation
  fields:
    candidate_site_catalog:
      type: path
      description: CSV path relative to the GTEP case unless absolute.
    realization_policy:
      type: path
      description: YAML path relative to the GTEP case unless absolute.
    selected_variant:
      type: string
      default: balanced_baseline
    fast_screen:
      type: mapping
      optional: true
      fields:
        require_pass:
          type: boolean
          default: true
        max_allocation_to_incident_rating_ratio:
          type: number
          exclusive_minimum: 0
          optional: true
          description: >-
            Optional study-specific proxy threshold. When absent the ratio is
            reported but is not treated as a power-flow acceptance criterion.

generation_realization:
  optional_candidate_columns:
    PCM_Unit_Size_MW:
      type: number
      exclusive_minimum: 0
      description: >-
        When supplied, split solved aggregate build capacity into fixed-size PCM
        units. A final partial unit is allowed only for candidates without unit
        commitment (Flag_UC != 1). When absent, preserve the legacy one-row
        realization.
  identity:
    pattern: "<Candidate_ID>__UNIT_<sequence>"
    sequence_format: three-digit, one-based

retirement_realization:
  type: mapping
  optional: true
  fields:
    method:
      default: proportional_capacity
      allowed:
        - proportional_capacity
        - largest_first
        - smallest_first
        - priority
    priority_column:
      default: Retirement_Priority
      required_when: method == priority
      description: Lower numeric values retire first; Asset_ID breaks ties.
    partial_unit_policy:
      default: allow_capacity_reduction
      allowed: [allow_capacity_reduction, reject]
  semantics:
    proportional_capacity: >-
      Apply the aggregate GTEP retention factor to every physical unit in the
      corresponding resource-aggregation group. This is the legacy default.
    largest_first: Retire higher-capacity physical units first.
    smallest_first: Retire lower-capacity physical units first.
    priority: Retire physical units in ascending priority-column order.

transmission_realization:
  method_priority:
    type: list
    allowed_items:
      - corridor_id
      - explicit_endpoints
      - proportional_parallel_corridor
  method_semantics:
    corridor_id: Match candidate and physical branch Corridor_ID.
    explicit_endpoints: Match PCM_from_bus and PCM_to_bus to branch endpoints.
    proportional_parallel_corridor: >-
      For zonal models only, distribute directional additions across parallel
      corridors in proportion to existing directional ratings.

identity:
  existing_assets:
    preferred_column: Asset_ID
    fallback: validated legacy row or aggregate mapping
  candidates:
    preferred_column: Candidate_ID
    realized_asset_pattern: "<Candidate_ID>__UNIT_<sequence>"
  requirements:
    - IDs, when supplied, are nonblank and unique within their tables.
    - Asset_ID must be present on both stages or neither stage.
    - Every GTEP Asset_ID must resolve in PCM before retirement transfer.

provenance:
  source_register:
    type: case_file_reference
    fields:
      case:
        allowed: [gtep, pcm]
      path: string
    required_columns:
      - Dataset
      - Role
      - Source
      - License_or_terms
      - Transformation
  confidence:
    type: mapping
    optional: true
    description: Distinguishes observed, derived, inferred, and assumed fields.

integrity:
  hashing: SHA-256 of every file under each source DataCase directory
  mutation_policy: Source data must be byte-for-byte unchanged after the workflow.
  report_files:
    - realized_inputs/handoff_contract.yml
    - realized_inputs/handoff_contract_checks.csv

migration_policy:
  unknown_version: reject
  missing_contract: >-
    Preserve validated legacy linkage behavior and emit a warning-level contract
    check. Cases opting into this schema receive strict physical checks.
