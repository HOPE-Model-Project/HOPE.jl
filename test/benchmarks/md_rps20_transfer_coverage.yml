benchmark_id: md-rps20-transfer-coverage
description: >-
  Reference values for the internal Maryland transfer-coverage benchmark. It
  solves the 8760-hour four-zone GTEP case and a 48-hour warm-up plus 744-hour
  July PCM case on the 656-bus network. Test-only assumptions deliberately
  exercise retirement and transmission realization and are not planning
  recommendations.
